services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: n3_iot_app_local
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./.env.docker.example:/var/www/html/.env:ro
    ports:
      - "8082:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      COMPOSER_ALLOW_SUPERUSER: "1"
      ENV: "prod"
      APP_TIMEZONE: "Europe/Paris"
      DB_HOST: "db"
      DB_NAME: "iot_n3_local"
      DB_USER: "iot_n3_user"
      DB_PASS: "iot_n3_pass"
      SIG_VALID_WINDOW: "300"
      # API_KEY / API_SIG_SECRET : lus depuis .env.docker.example (monte en /var/www/html/.env)
      # Auth pages : valeurs completes dans .env.docker.example (monte en /var/www/html/.env)
      # Mot de passe session local documente : localadmin
      ALERT_EMAIL: "dev@example.local"
      NOTIF_EMAIL_RECIPIENT: "dev@example.local"
      MAIL_FROM: "n3 iot local <dev@example.local>"
      LOG_FILE_PATH: "cronlog.txt"
      GALLERY_MSP1_DIR: "uploads/msp1"
      GALLERY_N3PP_DIR: "uploads/n3pp"
      GALLERY_FFP3_DIR: "uploads/ffp3"
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: n3_iot_db_local
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root_local_iot_n3
      MYSQL_DATABASE: iot_n3_local
      MYSQL_USER: iot_n3_user
      MYSQL_PASSWORD: iot_n3_pass
    ports:
      - "3307:3306"
    volumes:
      - db_data_local:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_local_iot_n3"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: n3_iot_phpmyadmin_local
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root_local_iot_n3
      UPLOAD_LIMIT: 64M
    ports:
      - "8083:80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data_local:
